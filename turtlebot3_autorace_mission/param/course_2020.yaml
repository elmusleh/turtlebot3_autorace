# TurtleBot3 AutoRace 2020 Course Configuration
# Waypoints format:
#   x, y: World coordinates on the 0.25m course centerline grid (m)
#   stage: Mission state label published on /mission/state
#   radius: Capture radius (m)
#   speed: Target linear velocity (m/s)
#   precision: If true, aligns yaw in place before driving forward
#   pause_sec: Seconds to hold still at this waypoint to read/display sign detection
#   pause_yaw: Optional target yaw (rad) to face the traffic sign squarely during pause

sign_stop_seconds: 3.0

